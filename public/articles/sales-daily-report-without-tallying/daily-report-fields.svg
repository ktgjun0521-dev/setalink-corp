<svg xmlns="http://www.w3.org/2000/svg" width="560" height="982" viewBox="0 0 560 982" role="img" aria-labelledby="fig-title fig-desc" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',Meiryo,sans-serif">
  <title id="fig-title">日報の項目は、入力の形で分かれる。選ぶ形・数字・日付は自動で集計し、自由に書く欄は読むために使う</title>
  <desc id="fig-desc">上は、1か所にまとめた日報の入力。項目は5つの例。見積もりの金額は数字で入れる。商談の段階は、初回・提案・見積もり・受注から選ぶ。お客様は、番号つきの一覧から選ぶ。次に会う日は日付で入れる。気づいたこと・相談（先方の反応、困っていること）は自由に書く。選ぶ形・数字・日付の項目は、自動で集計し、人が数えない。自由に書く欄は、読んで使い、数えない。集計した数字から、毎日見る数字は少なく選ぶ。たとえば、今日の面談の件数と目標との差、段階ごとの商談の件数、次に会う日が入っていないお客様。項目と数字は、説明のための例。</desc>
  <rect x="0" y="0" width="560" height="982" fill="#FFFDF7"/>
  <rect x="24" y="24" width="512" height="486" fill="#FFFDF7" stroke="#16161D" stroke-width="2"/>
  <rect x="24" y="24" width="512" height="10" fill="#16161D"/>
  <text x="44" y="76" font-size="22" font-weight="700" fill="#16161D" text-anchor="start">日報の入力（1か所）</text>
  <rect x="44" y="98" width="472" height="54" fill="#E8EEFF"/>
  <text x="62" y="133" font-size="22" font-weight="700" fill="#16161D" text-anchor="start">見積もりの金額</text>
  <rect x="434" y="108" width="66" height="34" fill="#2D5BFF"/>
  <text x="467" y="132.2" font-size="20" font-weight="700" fill="#FFFDF7" text-anchor="middle">数字</text>
  <rect x="44" y="162" width="472" height="82" fill="#E8EEFF"/>
  <text x="62" y="197" font-size="22" font-weight="700" fill="#16161D" text-anchor="start">商談の段階</text>
  <text x="62" y="228" font-size="20" font-weight="500" fill="#5A5D66" text-anchor="start">初回・提案・見積もり・受注</text>
  <rect x="434" y="186" width="66" height="34" fill="#2D5BFF"/>
  <text x="467" y="210.2" font-size="20" font-weight="700" fill="#FFFDF7" text-anchor="middle">選ぶ</text>
  <rect x="44" y="254" width="472" height="82" fill="#E8EEFF"/>
  <text x="62" y="289" font-size="22" font-weight="700" fill="#16161D" text-anchor="start">お客様</text>
  <text x="62" y="320" font-size="20" font-weight="500" fill="#5A5D66" text-anchor="start">一覧から選ぶ（番号つき）</text>
  <rect x="434" y="278" width="66" height="34" fill="#2D5BFF"/>
  <text x="467" y="302.2" font-size="20" font-weight="700" fill="#FFFDF7" text-anchor="middle">選ぶ</text>
  <rect x="44" y="346" width="472" height="54" fill="#E8EEFF"/>
  <text x="62" y="381" font-size="22" font-weight="700" fill="#16161D" text-anchor="start">次に会う日</text>
  <rect x="434" y="356" width="66" height="34" fill="#2D5BFF"/>
  <text x="467" y="380.2" font-size="20" font-weight="700" fill="#FFFDF7" text-anchor="middle">日付</text>
  <rect x="44" y="410" width="472" height="82" fill="#EFEBE0"/>
  <text x="62" y="445" font-size="22" font-weight="700" fill="#16161D" text-anchor="start">気づいたこと・相談</text>
  <text x="62" y="476" font-size="20" font-weight="500" fill="#5A5D66" text-anchor="start">先方の反応、困っていること</text>
  <rect x="371" y="434" width="129" height="34" fill="#5A5D66"/>
  <text x="435.5" y="458.2" font-size="20" font-weight="700" fill="#FFFDF7" text-anchor="middle">自由に書く</text>
  <line x1="100" y1="518" x2="100" y2="552.3" stroke="#2D5BFF" stroke-width="3" stroke-linecap="round"/>
  <polygon points="100,564 91.9,547.8 108.1,547.8" fill="#2D5BFF"/>
  <text x="118" y="548" font-size="20" font-weight="700" fill="#2D5BFF" text-anchor="start">選ぶ・数字・日付</text>
  <line x1="451" y1="518" x2="451" y2="554.1" stroke="#16161D" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="451,564 444.2,550.2 457.8,550.2" fill="#16161D"/>
  <text x="433" y="548" font-size="20" font-weight="700" fill="#5A5D66" text-anchor="end">自由に書く</text>
  <rect x="24" y="574" width="330" height="96" fill="#E8EEFF"/>
  <text x="44" y="614" font-size="22" font-weight="700" fill="#16161D" text-anchor="start">自動で集計</text>
  <text x="44" y="646" font-size="20" font-weight="500" fill="#5A5D66" text-anchor="start">人が数えない</text>
  <rect x="366" y="574" width="170" height="96" fill="#EFEBE0"/>
  <text x="384" y="614" font-size="22" font-weight="700" fill="#16161D" text-anchor="start">読んで使う</text>
  <text x="384" y="646" font-size="20" font-weight="500" fill="#5A5D66" text-anchor="start">数えない</text>
  <line x1="189" y1="680" x2="189" y2="708.3" stroke="#2D5BFF" stroke-width="3" stroke-linecap="round"/>
  <polygon points="189,720 180.9,703.8 197.1,703.8" fill="#2D5BFF"/>
  <rect x="24" y="730" width="512" height="196" fill="#EEF6C9"/>
  <rect x="24" y="730" width="6" height="196" fill="#2D5BFF"/>
  <text x="46" y="770" font-size="22" font-weight="700" fill="#16161D" text-anchor="start">毎日見る数字は、少なく</text>
  <text x="46" y="802" font-size="20" font-weight="500" fill="#5A5D66" text-anchor="start">たとえば</text>
  <text x="46" y="836" font-size="22" font-weight="700" fill="#16161D" text-anchor="start"><tspan x="46" dy="0">・今日の面談の件数と、目標との差</tspan><tspan x="46" dy="32">・段階ごとの商談の件数</tspan><tspan x="46" dy="32">・次に会う日が入っていないお客様</tspan></text>
  <text x="24" y="960" font-size="20" font-weight="500" fill="#5A5D66" text-anchor="start">※ 項目と数字は、説明のための例です。</text>
</svg>
