  <rect x="24" y="648" width="332.9" height="34" fill="#16161D"/>
  <text x="190.5" y="672.2" font-size="20" font-weight="700" fill="#FFFDF7" text-anchor="middle">いちばん落ちている所を選ぶ</text>
  <rect x="24" y="694" width="512" height="104" fill="#E8EEFF"/>
  <text x="48" y="732" font-size="20" font-weight="500" fill="#5A5D66" text-anchor="start">今月直すのは、</text>
  <text x="48" y="770" font-size="23" font-weight="700" fill="#16161D" text-anchor="start">予約から来店に進む割合（50%）</text>
  <line x1="280" y1="808" x2="280" y2="834.3" stroke="#2D5BFF" stroke-width="3" stroke-linecap="round"/>
  <polygon points="280,846 271.9,829.8 288.1,829.8" fill="#2D5BFF"/>
  <rect x="24" y="858" width="281.7" height="34" fill="#16161D"/>
  <text x="164.9" y="882.2" font-size="20" font-weight="700" fill="#FFFDF7" text-anchor="middle">行動の数字に言い換える</text>
  <rect x="24" y="904" width="512" height="154" fill="#EEF6C9"/>
  <rect x="24" y="904" width="6" height="154" fill="#2D5BFF"/>
  <text x="46" y="940" font-size="20" font-weight="700" fill="#2D5BFF" text-anchor="start">現場が毎週追う数字（例）</text>
  <text x="46" y="974" font-size="22" font-weight="700" fill="#16161D" text-anchor="start">予約の前日に確認の連絡を入れた件数</text>
  <text x="46" y="1008" font-size="20" font-weight="500" fill="#5A5D66" text-anchor="start"><tspan x="46" dy="0">入会数や売上は、結果として出る数字。</tspan><tspan x="46" dy="28">追う数字にはしない</tspan></text>
</svg>
