  <text x="84" y="616" font-size="24" font-weight="700" fill="#16161D" text-anchor="start">作り分けが要る会社</text>
  <text x="84" y="648" font-size="20" font-weight="500" fill="#5A5D66" text-anchor="start"><tspan x="84" dy="0">役割によって、</tspan><tspan x="84" dy="28">見るものも、やることも違う</tspan></text>
