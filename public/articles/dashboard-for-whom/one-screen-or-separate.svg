<svg xmlns="http://www.w3.org/2000/svg" width="560" height="1018" viewBox="0 0 560 1018" role="img" aria-labelledby="fig-title fig-desc" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',Meiryo,sans-serif">
  <title id="fig-title">自分たちで作って足りる会社と、作り分けが要る会社</title>
  <desc id="fig-desc">見分ける問いは、社長から現場まで、全員が同じ理解で動けるか。「はい」なら、自分たちで作って、足りる会社。小さな組織で、全員が同じ理解で動ける。経営者も現場も、同じ1つの画面を見る。「いいえ」なら、作り分けが要る会社。役割によって、見るものも、やることも違う。経営者は経営者の画面を、現場は現場の画面を見る。経営者には経営者の画面、現場には現場の画面。経営者の目線だけで作った画面は、現場の行動を変えない。</desc>
  <rect x="0" y="0" width="560" height="1018" fill="#FFFDF7"/>
  <rect x="24" y="24" width="512" height="138" fill="none" stroke="#16161D" stroke-width="2"/>
  <text x="44" y="62" font-size="20" font-weight="700" fill="#2D5BFF" text-anchor="start">見分ける問い</text>
  <text x="44" y="100" font-size="25" font-weight="700" fill="#16161D" text-anchor="start"><tspan x="44" dy="0">社長から現場まで、全員が</tspan><tspan x="44" dy="36">同じ理解で動けるか</tspan></text>
  <line x1="40" y1="162" x2="40" y2="561" stroke="#16161D" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="40" y1="225" x2="55" y2="225" stroke="#16161D" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="64,225 51.5,231.2 51.5,218.8" fill="#16161D"/>
  <line x1="40" y1="561" x2="55" y2="561" stroke="#16161D" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="64,561 51.5,567.2 51.5,554.8" fill="#16161D"/>
  <rect x="64" y="186" width="472" height="316" fill="#EEF6C9"/>
  <rect x="84" y="208" width="70" height="34" fill="#2D5BFF"/>
  <text x="119" y="232.2" font-size="20" font-weight="700" fill="#FFFDF7" text-anchor="middle">はい</text>
  <text x="84" y="280" font-size="24" font-weight="700" fill="#16161D" text-anchor="start">自分たちで作って、足りる会社</text>
  <text x="84" y="312" font-size="20" font-weight="500" fill="#5A5D66" text-anchor="start"><tspan x="84" dy="0">小さな組織で、</tspan><tspan x="84" dy="28">全員が同じ理解で動ける</tspan></text>
  <rect x="84" y="364" width="124" height="48" fill="#FFFDF7" stroke="#16161D" stroke-width="2"/>
  <text x="146" y="396" font-size="22" font-weight="700" fill="#16161D" text-anchor="middle">経営者</text>
  <rect x="84" y="430" width="124" height="48" fill="#FFFDF7" stroke="#16161D" stroke-width="2"/>
  <text x="146" y="462" font-size="22" font-weight="700" fill="#16161D" text-anchor="middle">現場</text>
