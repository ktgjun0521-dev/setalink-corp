  <line x1="208" y1="724" x2="328.1" y2="724" stroke="#16161D" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="338,724 324.2,730.8 324.2,717.2" fill="#16161D"/>
  <line x1="208" y1="796" x2="328.1" y2="796" stroke="#16161D" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="338,796 324.2,802.8 324.2,789.2" fill="#16161D"/>
  <text x="84" y="868" font-size="23" font-weight="700" fill="#16161D" text-anchor="start"><tspan x="84" dy="0">経営者には経営者の画面、</tspan><tspan x="84" dy="33">現場には現場の画面</tspan></text>
  <text x="84" y="940" font-size="20" font-weight="500" fill="#5A5D66" text-anchor="start"><tspan x="84" dy="0">経営者の目線だけで作った画面は、</tspan><tspan x="84" dy="28">現場の行動を変えない</tspan></text>
