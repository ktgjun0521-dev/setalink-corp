  <rect x="340" y="362" width="176" height="10" fill="#16161D"/>
  <text x="428" y="408" font-size="22" font-weight="700" fill="#16161D" text-anchor="middle">1つの画面</text>
  <rect x="383" y="448" width="16" height="18" fill="#EFEBE0" stroke="#16161D" stroke-width="1.5"/>
  <rect x="407" y="436" width="16" height="30" fill="#EFEBE0" stroke="#16161D" stroke-width="1.5"/>
