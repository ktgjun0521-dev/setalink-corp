<svg xmlns="http://www.w3.org/2000/svg" width="560" height="950" viewBox="0 0 560 950" role="img" aria-labelledby="fig-title fig-desc" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',Meiryo,sans-serif">
  <title id="fig-title">同じお客様が、場所ごとに別のもので見分けられているいまと、共通の番号で1本につないだあと</title>
  <desc id="fig-desc">上の段は、いま。広告、問い合わせ、商談、契約、入金の5つの段階で、同じお客様を見分けるものが違う。広告はクリックの数だけ、問い合わせはメールアドレス、商談は会社名と担当者名、契約は契約書の番号、入金は振込の名義。段階と段階のあいだは切れていて、同じ人だと分からず、つながらない。下の段は、共通の番号を付けたあと。問い合わせの時点で、たとえば番号0123を付け、商談・契約・入金の記録にも同じ番号0123を入れる。広告は、入口の広告（たとえば広告A）として、問い合わせの記録に残す。5つの段階が1本の線でつながり、1人の流れを最後まで追える。番号と広告の名前は、説明のための例。</desc>
  <rect x="0" y="0" width="560" height="950" fill="#FFFDF7"/>
  <rect x="24" y="24" width="512" height="402" fill="#EFEBE0"/>
  <rect x="44" y="44" width="70" height="34" fill="#16161D"/>
  <text x="79" y="68.2" font-size="20" font-weight="700" fill="#FFFDF7" text-anchor="middle">いま</text>
  <text x="128" y="70" font-size="22" font-weight="700" fill="#16161D" text-anchor="start">見分け方が、場所ごとに違う</text>
  <rect x="84" y="98" width="432" height="44" fill="#FFFDF7"/>
  <text x="102" y="128" font-size="22" font-weight="700" fill="#16161D" text-anchor="start">広告</text>
  <text x="248" y="128" font-size="22" font-weight="700" fill="#16161D" text-anchor="start">クリックの数だけ</text>
  <rect x="84" y="154" width="432" height="44" fill="#FFFDF7"/>
  <text x="102" y="184" font-size="22" font-weight="700" fill="#16161D" text-anchor="start">問い合わせ</text>
  <text x="248" y="184" font-size="22" font-weight="700" fill="#16161D" text-anchor="start">メールアドレス</text>
  <rect x="84" y="210" width="432" height="44" fill="#FFFDF7"/>
  <text x="102" y="240" font-size="22" font-weight="700" fill="#16161D" text-anchor="start">商談</text>
  <text x="248" y="240" font-size="22" font-weight="700" fill="#16161D" text-anchor="start">会社名と担当者名</text>
  <rect x="84" y="266" width="432" height="44" fill="#FFFDF7"/>
  <text x="102" y="296" font-size="22" font-weight="700" fill="#16161D" text-anchor="start">契約</text>
  <text x="248" y="296" font-size="22" font-weight="700" fill="#16161D" text-anchor="start">契約書の番号</text>
  <rect x="84" y="322" width="432" height="44" fill="#FFFDF7"/>
  <text x="102" y="352" font-size="22" font-weight="700" fill="#16161D" text-anchor="start">入金</text>
  <text x="248" y="352" font-size="22" font-weight="700" fill="#16161D" text-anchor="start">振込の名義</text>
  <circle cx="64" cy="120" r="8" fill="#5A5D66"/>
  <circle cx="64" cy="176" r="8" fill="#5A5D66"/>
  <circle cx="64" cy="232" r="8" fill="#5A5D66"/>
  <circle cx="64" cy="288" r="8" fill="#5A5D66"/>
  <circle cx="64" cy="344" r="8" fill="#5A5D66"/>
  <text x="64" y="155" font-size="20" font-weight="700" fill="#5A5D66" text-anchor="middle">×</text>
  <text x="64" y="211" font-size="20" font-weight="700" fill="#5A5D66" text-anchor="middle">×</text>
  <text x="64" y="267" font-size="20" font-weight="700" fill="#5A5D66" text-anchor="middle">×</text>
  <text x="64" y="323" font-size="20" font-weight="700" fill="#5A5D66" text-anchor="middle">×</text>
  <text x="44" y="404" font-size="22" font-weight="700" fill="#16161D" text-anchor="start">同じ人だと分からず、つながらない</text>
  <line x1="190" y1="438" x2="190" y2="466.3" stroke="#2D5BFF" stroke-width="3" stroke-linecap="round"/>
  <polygon points="190,478 181.9,461.8 198.1,461.8" fill="#2D5BFF"/>
  <text x="214" y="466" font-size="20" font-weight="700" fill="#2D5BFF" text-anchor="start">共通の番号を付けると</text>
  <rect x="24" y="490" width="512" height="436" fill="#E8EEFF"/>
  <rect x="44" y="510" width="112" height="34" fill="#2D5BFF"/>
  <text x="100" y="534.2" font-size="20" font-weight="700" fill="#FFFDF7" text-anchor="middle">つなぐと</text>
  <text x="170" y="536" font-size="22" font-weight="700" fill="#16161D" text-anchor="start">共通の番号で、1本の線に</text>
  <rect x="84" y="564" width="432" height="44" fill="#FFFDF7"/>
  <text x="102" y="594" font-size="22" font-weight="700" fill="#16161D" text-anchor="start">広告</text>
  <text x="248" y="594" font-size="22" font-weight="700" fill="#2D5BFF" text-anchor="start">入口の広告：広告A</text>
  <rect x="84" y="620" width="432" height="44" fill="#FFFDF7"/>
  <text x="102" y="650" font-size="22" font-weight="700" fill="#16161D" text-anchor="start">問い合わせ</text>
  <text x="248" y="650" font-size="22" font-weight="700" fill="#2D5BFF" text-anchor="start">番号 0123 を付ける</text>
  <rect x="84" y="676" width="432" height="44" fill="#FFFDF7"/>
  <text x="102" y="706" font-size="22" font-weight="700" fill="#16161D" text-anchor="start">商談</text>
  <text x="248" y="706" font-size="22" font-weight="700" fill="#2D5BFF" text-anchor="start">番号 0123</text>
  <rect x="84" y="732" width="432" height="44" fill="#FFFDF7"/>
  <text x="102" y="762" font-size="22" font-weight="700" fill="#16161D" text-anchor="start">契約</text>
  <text x="248" y="762" font-size="22" font-weight="700" fill="#2D5BFF" text-anchor="start">番号 0123</text>
  <rect x="84" y="788" width="432" height="44" fill="#FFFDF7"/>
  <text x="102" y="818" font-size="22" font-weight="700" fill="#16161D" text-anchor="start">入金</text>
  <text x="248" y="818" font-size="22" font-weight="700" fill="#2D5BFF" text-anchor="start">番号 0123</text>
  <line x1="64" y1="586" x2="64" y2="810" stroke="#2D5BFF" stroke-width="4" stroke-linecap="round"/>
  <circle cx="64" cy="586" r="9" fill="#2D5BFF"/>
  <circle cx="64" cy="642" r="9" fill="#2D5BFF"/>
  <circle cx="64" cy="698" r="9" fill="#2D5BFF"/>
  <circle cx="64" cy="754" r="9" fill="#2D5BFF"/>
  <circle cx="64" cy="810" r="9" fill="#2D5BFF"/>
  <text x="44" y="870" font-size="22" font-weight="700" fill="#16161D" text-anchor="start">1人の流れを、最後まで追える</text>
  <text x="44" y="904" font-size="20" font-weight="500" fill="#5A5D66" text-anchor="start">※ 番号と広告名は、説明のための例</text>
</svg>
