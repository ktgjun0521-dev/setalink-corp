<svg xmlns="http://www.w3.org/2000/svg" width="560" height="752" viewBox="0 0 560 752" role="img" aria-labelledby="fig-title fig-desc" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',Meiryo,sans-serif">
  <title id="fig-title">比べる相手を置くと、増えた分のうち、施策の分が分かる（計算例）</title>
  <desc id="fig-desc">説明のための計算例で、実在の会社の数字ではない。施策を試した3店舗は、入会が先月100人から今月130人に、30人増えた。試していない3店舗は、先月100人から今月120人に、20人増えた。試した店舗で増えた30人の内訳は、20人が季節など、どの店舗にも起きた増え方、10人が施策の分と見てよい。条件の近い店舗どうしで比べる。</desc>
  <rect x="0" y="0" width="560" height="752" fill="#FFFDF7"/>
  <text x="24" y="46" font-size="20" font-weight="500" fill="#5A5D66" text-anchor="start"><tspan x="24" dy="0">※ 説明のための計算例です。</tspan><tspan x="24" dy="28">実在の会社の数字ではありません。</tspan></text>
  <rect x="24" y="104" width="512" height="152" fill="#EFEBE0"/>
  <text x="44" y="144" font-size="22" font-weight="700" fill="#16161D" text-anchor="start">施策を試した3店舗</text>
  <text x="516" y="144" font-size="22" font-weight="700" fill="#2D5BFF" text-anchor="end">+30人</text>
  <text x="44" y="190" font-size="20" font-weight="500" fill="#5A5D66" text-anchor="start">先月</text>
  <rect x="120" y="172" width="230" height="24" fill="#16161D"/>
  <text x="516" y="191" font-size="20" font-weight="500" fill="#5A5D66" text-anchor="end">100人</text>
  <text x="44" y="232" font-size="20" font-weight="700" fill="#16161D" text-anchor="start">今月</text>
  <rect x="120" y="214" width="230" height="24" fill="#16161D"/>
  <rect x="350" y="214" width="46" height="24" fill="#5A5D66"/>
  <rect x="396" y="214" width="23" height="24" fill="#2D5BFF"/>
  <text x="516" y="233" font-size="22" font-weight="700" fill="#16161D" text-anchor="end">130人</text>
  <rect x="24" y="268" width="512" height="152" fill="#EFEBE0"/>
  <text x="44" y="308" font-size="22" font-weight="700" fill="#16161D" text-anchor="start">試していない3店舗</text>
  <text x="516" y="308" font-size="22" font-weight="700" fill="#2D5BFF" text-anchor="end">+20人</text>
  <text x="44" y="354" font-size="20" font-weight="500" fill="#5A5D66" text-anchor="start">先月</text>
  <rect x="120" y="336" width="230" height="24" fill="#16161D"/>
  <text x="516" y="355" font-size="20" font-weight="500" fill="#5A5D66" text-anchor="end">100人</text>
  <text x="44" y="396" font-size="20" font-weight="700" fill="#16161D" text-anchor="start">今月</text>
  <rect x="120" y="378" width="230" height="24" fill="#16161D"/>
  <rect x="350" y="378" width="46" height="24" fill="#5A5D66"/>
  <text x="516" y="397" font-size="22" font-weight="700" fill="#16161D" text-anchor="end">120人</text>
  <line x1="60" y1="430" x2="60" y2="456.3" stroke="#2D5BFF" stroke-width="3" stroke-linecap="round"/>
  <polygon points="60,468 51.9,451.8 68.1,451.8" fill="#2D5BFF"/>
  <text x="88" y="457" font-size="20" font-weight="700" fill="#2D5BFF" text-anchor="start">増えた30人を、分けてみると</text>
  <rect x="24" y="480" width="512" height="248" fill="#EEF6C9"/>
  <rect x="24" y="480" width="6" height="248" fill="#2D5BFF"/>
  <text x="46" y="518" font-size="20" font-weight="700" fill="#2D5BFF" text-anchor="start">試した店舗の +30人の内訳</text>
  <rect x="46" y="536" width="292" height="46" fill="#5A5D66"/>
  <rect x="338" y="536" width="146" height="46" fill="#2D5BFF"/>
  <text x="192" y="567" font-size="22" font-weight="700" fill="#FFFDF7" text-anchor="middle">20人</text>
  <text x="411" y="567" font-size="22" font-weight="700" fill="#FFFDF7" text-anchor="middle">10人</text>
  <rect x="46" y="604" width="18" height="18" fill="#5A5D66"/>
  <text x="76" y="621" font-size="20" font-weight="500" fill="#16161D" text-anchor="start">季節など、どの店舗にも起きた増え方</text>
  <rect x="46" y="640" width="18" height="18" fill="#2D5BFF"/>
  <text x="76" y="657" font-size="22" font-weight="700" fill="#2D5BFF" text-anchor="start">施策の分と見てよい</text>
  <text x="46" y="702" font-size="20" font-weight="500" fill="#5A5D66" text-anchor="start">条件の近い店舗どうしで比べる</text>
</svg>
